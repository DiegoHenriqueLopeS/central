/* CENTRAL visual refresh — Silver Norte */
:root{--bg:#090d14;--panel:#101824;--panel2:#151f2d;--line:#202d3d;--text:#f2f5fb;--muted:#91a0b4;--accent:#8ea5ff;--green:#55d6a4;--red:#ff7e8b;--yellow:#f2c66d}
body{background:radial-gradient(ellipse at 78% -12%,#1b2a45 0,transparent 38%),var(--bg);letter-spacing:.01em}
.app{grid-template-columns:258px minmax(0,1fr)}
.side{background:rgba(10,15,24,.94);border-right:1px solid #1c2939;padding:25px 16px;backdrop-filter:blur(18px)}
.brand{padding:0 10px 28px}.logo{width:40px;height:40px;border-radius:13px;box-shadow:0 7px 24px #8298ff24}
.brand strong{font-size:15px;letter-spacing:2px}.brand small{font-size:11px;letter-spacing:.2px}
.navlabel{font-size:9px;color:#66758b;letter-spacing:1.8px;padding:18px 12px 8px}
.nav button{padding:11px 13px;border:1px solid transparent;border-radius:10px;color:#aebbd0;transition:background .18s,border-color .18s,transform .18s}
.nav button:hover{background:#151f2d;border-color:#25354a;transform:translateX(2px)}
.nav button.active{background:linear-gradient(100deg,#263654,#1a2639);border-color:#34496a;color:#fff;box-shadow:inset 3px 0 #9aafff}
.nav .ico{font-size:16px;color:#9eb0ff}
.sidefoot{border-color:#202d3d;color:#73839a;line-height:1.8}
.top{height:76px;padding:0 34px;background:rgba(9,13,20,.78);backdrop-filter:blur(16px);border-color:#1b2736}
.top>div:first-child strong{font-size:13px;letter-spacing:.2px}.top small{font-size:11px}
.content{max-width:1600px;padding:32px 34px 44px}
.pagehead{margin-bottom:22px}.pagehead h1{font-size:27px;letter-spacing:-.8px}.pagehead p{font-size:12px;color:#94a3b8}
.btn{border-radius:10px;background:#131e2b;border-color:#29384b;transition:.18s}
.btn:hover{border-color:#7189c7;background:#1a2940}
.btn.primary{background:linear-gradient(135deg,#a9b8ff,#8198f7);border:0;color:#0b1220;box-shadow:0 7px 20px #8198f729}
.card,.panel{background:linear-gradient(145deg,rgba(18,27,40,.98),rgba(14,22,33,.98));border:1px solid #243246;border-radius:16px;box-shadow:0 12px 35px #00000014}
.panel{padding:20px}.panel h3{font-size:13px;letter-spacing:.15px;color:#e8edf7}
.cards{gap:13px}.card{padding:17px 18px;position:relative;overflow:hidden}
.card:after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;right:-42px;top:-46px;background:#93a8ff0b}
.metric-label{font-size:11px;letter-spacing:.25px;color:#9aa9bd}
.metric{font-size:26px;letter-spacing:-1px;margin:9px 0 4px}.metric-sub{font-size:10px;color:#8190a5}
.field{background:#0b121c;border-color:#28374a;border-radius:10px}
.tablewrap{border-color:#253347;border-radius:12px}
th{background:#151f2e;color:#94a5bd;font-size:10px;letter-spacing:.8px}
td{color:#d2dbea;border-color:#202d3d}
tr:hover td{background:#ffffff05}
.pill{border:1px solid #314158;background:#1a2636}
.quick{border-radius:12px;background:#121e2c;border-color:#29394f;padding:15px;transition:.18s}
.quick:hover{background:#1a2a40;border-color:#647db7;transform:translateY(-2px)}
.quick span{font-size:11px;color:#91a1b7}
.bar{background:#202d3e}.bar i{background:linear-gradient(90deg,#718bf0,#a7b5ff)}
.modal{background:#101925;border-color:#2b3b50;box-shadow:0 25px 90px #0009}
@media(max-width:1000px){.content{padding:24px 18px}}

/* Dashboard composition */
.dash-intro{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:22px 24px;margin-bottom:16px;border:1px solid #344666;border-radius:17px;background:radial-gradient(circle at 85% 20%,#526da833,transparent 34%),linear-gradient(110deg,#18263a,#111b2a 72%);overflow:hidden}
.dash-intro h1{font-size:25px;margin:0 0 5px;letter-spacing:-.8px}.dash-intro p{margin:0;color:#a6b5ca;font-size:12px}
.dash-kicker{font-size:9px;letter-spacing:1.7px;text-transform:uppercase;color:#aabaff;margin-bottom:8px}
.dash-intro .toolbar{margin:0;justify-content:flex-end}
.dash-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:16px}
.dash-stat{padding:17px 18px;border:1px solid #253449;border-radius:15px;background:linear-gradient(145deg,#131e2d,#101824);min-width:0}
.dash-stat-top{display:flex;align-items:center;justify-content:space-between;color:#9aa9bd;font-size:11px}
.dash-stat-icon{width:29px;height:29px;border-radius:9px;display:grid;place-items:center;background:#8ea5ff18;color:#a8b8ff;font-size:15px}
.dash-stat-value{font-size:25px;font-weight:760;letter-spacing:-1px;margin:10px 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dash-stat-foot{font-size:10px;color:#8392a7}
.dash-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(280px,.85fr);gap:15px;margin-bottom:15px}
.dash-panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.dash-panel-head h3{margin:0}.dash-panel-head small{font-size:10px;color:#8090a6}
.dash-chart{height:172px;display:flex;align-items:flex-end;gap:10px;padding:12px 2px 0;border-bottom:1px solid #29364a}
.dash-month{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:7px;min-width:0}
.dash-month strong{font-size:9px;color:#aab8cc;font-weight:600}
.dash-month i{display:block;width:min(34px,70%);min-height:3px;border-radius:7px 7px 2px 2px;background:linear-gradient(180deg,#aabaff,#647fe8);box-shadow:0 0 16px #8298ff22}
.dash-month span{font-size:9px;color:#77879e}
.dash-activity{display:flex;flex-direction:column;gap:0}
.dash-activity-item{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-bottom:1px solid #202d3d}
.dash-activity-item:last-child{border:0}
.dash-activity-dot{width:8px;height:8px;border-radius:50%;background:#91a7ff;margin:5px 0 0;box-shadow:0 0 0 4px #91a7ff17;flex:none}
.dash-activity-item strong{display:block;font-size:11px;color:#e3eaf5;font-weight:650}
.dash-activity-item small{font-size:10px;color:#8191a7}
.dash-empty{padding:24px 8px;text-align:center;color:#8191a7;font-size:11px}
.dash-bottom{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(260px,.8fr);gap:15px}
.dash-stock{display:flex;flex-direction:column;gap:14px}
.dash-stock-row{display:grid;grid-template-columns:minmax(90px,1fr) 1.5fr auto;align-items:center;gap:10px;font-size:10px;color:#aebbd0}
.dash-stock-row .bar{height:7px}
@media(max-width:1050px){.dash-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.dash-grid,.dash-bottom{grid-template-columns:1fr}}
@media(max-width:700px){.dash-intro{align-items:flex-start;flex-direction:column;padding:19px}.dash-intro .toolbar{width:100%;justify-content:flex-start}.dash-intro h1{font-size:22px}.dash-stats{gap:8px}.dash-stat{padding:13px}.dash-stat-value{font-size:21px}.dash-chart{gap:4px}.dash-stock-row{grid-template-columns:85px 1fr auto}}

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
// Converte valores digitados no padrão brasileiro (1.234,56) e também decimal com ponto (1234.56).
const moneyKeys=new Set(['offer','cost','price','productCost','unitProductionCost','freight','otherCost','unitPrice','discount','amount']);
function parseMoney(value){if(value===null||value===undefined||String(value).trim()==='')return 0;let s=String(value).trim().replace(/R\$|\s/g,'');if(s.includes(',')){s=s.replace(/\./g,'').replace(',','.')}else if(/^[-+]?\d{1,3}(\.\d{3})+$/.test(s)){s=s.replace(/\./g,'')}const n=Number(s);return Number.isFinite(n)?Math.round((n+Number.EPSILON)*100)/100:0}
function moneyInputValue(value){if(value===null||value===undefined||value==='')return '';return Number(value).toLocaleString('pt-BR',{useGrouping:false,minimumFractionDigits:0,maximumFractionDigits:2})}
const today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const seed={products:[{id:1,name:'Placa NFC Google',type:'Produto físico',category:'Placas NFC',active:'Ativo'}],lots:[],visits:[],clients:[],sales:[],expenses:[],notes:[],projects:[],files:[],customCats:['Ideias','Estratégias','Vendas','Marketing','Pesquisas','Aprendizados','Frases','Referências']};
let db; try{db=JSON.parse(localStorage.getItem('central_db_v1'))||seed}catch{db=seed}
for(const k of Object.keys(seed))if(!Array.isArray(db[k]))db[k]=[];
function normalizeVisitStatuses(){const legacy={'Oferta apresentada':'Proposta apresentada','Comprou':'Venda realizada','Recusou':'Sem interesse','Voltar depois':'Retorno agendado','Em negociação':'Proposta apresentada'};db.visits.forEach(v=>{if(legacy[v.status])v.status=legacy[v.status]})}
normalizeVisitStatuses();
let page='dashboard', editing=null, modalKind=null;
let selectedOperationId='all';
function operationFilter(){return selectedOperationId==='all'?null:getLot(selectedOperationId)}
function operationSelector(){return `<select class="field" onchange="selectedOperationId=this.value;render()"><option value="all" ${selectedOperationId==='all'?'selected':''}>Geral — todas as operações</option>${db.lots.map(l=>`<option value="${l.id}" ${String(selectedOperationId)===String(l.id)?'selected':''}>${esc(l.name)}</option>`).join('')}</select>`}
function operationSales(){const l=operationFilter();return db.sales.filter(x=>!l||String(x.lotId)===String(l.id))}
function operationExpenses(){const l=operationFilter();return db.expenses.filter(x=>!l||String(x.lotId)===String(l.id))}
let supabaseClient=null, currentUser=null, cloudSaveTimer=null;
function setCloudStatus(msg,ok=true){const el=document.getElementById('cloudStatus');if(el){el.textContent=(ok?'● ':'⚠ ')+msg;el.style.color=ok?'#58d6a0':'#ff9aa3'}}
function save(){try{localStorage.setItem('central_db_v1',JSON.stringify(db));if(currentUser&&supabaseClient){setCloudStatus('Salvando na nuvem…');clearTimeout(cloudSaveTimer);cloudSaveTimer=setTimeout(async()=>{try{const {error}=await supabaseClient.from('central_data').upsert({user_id:currentUser.id,data:db,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error)throw error;setCloudStatus('Sincronizado')}catch(e){console.error(e);setCloudStatus('Falha na nuvem: '+(e.message||'verifique a conexão'),false)}},450)}return true}catch(e){alert('Não foi possível salvar: o armazenamento do navegador pode estar cheio. Exporte um backup.');return false}}
const pages={dashboard:'Dashboard',visitas:'Comercial e visitas',clientes:'Clientes',vendas:'Vendas',estoque:'Produtos e estoque',financeiro:'Financeiro',ideias:'Ideias e conhecimento',projetos:'Projetos e metas',arquivos:'Central de arquivos',relatorios:'Relatórios',qrs:'QR Codes dinâmicos',config:'Configurações e backup'};
function id(){return Date.now()+Math.floor(Math.random()*999)}
function sum(arr,fn){return arr.reduce((a,x)=>a+Number(fn(x)||0),0)}
function getProduct(id){return db.products.find(p=>String(p.id)===String(id))}
function getClient(id){return db.clients.find(p=>String(p.id)===String(id))}
function getLot(id){return db.lots.find(p=>String(p.id)===String(id))}
function saleCost(s){if(s.cost!==''&&s.cost!=null)return Number(s.cost)||0;let l=getLot(s.lotId);return Number(s.qty||0)*Number(l?.unitCost||0)}
function saleProfit(s){return Number(s.total||0)-saleCost(s)}
function soldFromLot(lotId){return sum(db.sales.filter(s=>String(s.lotId)===String(lotId)&&s.status!=='Cancelada'),s=>s.qty)}
function available(l){return Math.max(0,Number(l.qty||0)-soldFromLot(l.id))}
function allQty(){return sum(db.lots,available)}
function statusPill(s){let cls=/venda realizada|pago|conclu/i.test(s)?'green':/sem interesse|cancel/i.test(s)?'red':/ausente|retorno|proposta|pendente/i.test(s)?'yellow':/demonstração|contato conseguido/i.test(s)?'green':'';return `<span class="pill ${cls}">${esc(s||'—')}</span>`}
function metric(label,value,sub=''){return `<div class="card"><div class="metric-label">${label}</div><div class="metric">${value}</div><div class="metric-sub">${sub}</div></div>`}
function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.join(''):`<tr><td class="empty" colspan="${headers.length}">Nenhum registro ainda. Use “Adicionar” para começar.</td></tr>`}</tbody></table></div>`}
function rowActions(kind,item){return `<button class="btn small" onclick="editRecord('${kind}',${item.id})">Editar</button> <button class="btn small danger" onclick="deleteRecord('${kind}',${item.id})">Excluir</button>`}
function render(){
 $('#topTitle').textContent=pages[page];$('#today').textContent=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});
 $$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
 const root=$('#content');
 if(page==='dashboard')root.innerHTML=dashboard();
 else if(page==='visitas')root.innerHTML=visitsPage();
 else if(page==='clientes')root.innerHTML=clientsPage();
 else if(page==='vendas')root.innerHTML=salesPage();
 else if(page==='estoque')root.innerHTML=stockPage();
 else if(page==='financeiro')root.innerHTML=financePage();
 else if(page==='ideias')root.innerHTML=notesPage();
 else if(page==='projetos')root.innerHTML=projectsPage();
 else if(page==='arquivos')root.innerHTML=filesPage();
 else if(page==='relatorios')root.innerHTML=reportsPage();
 else if(page==='qrs'){root.innerHTML=qrPage();loadQrs();}
 else root.innerHTML=configPage();
}

function qrPage(){return `<div class="pagehead"><div><h1>QR Codes dinâmicos</h1><p>Altere o destino quando quiser, sem precisar imprimir outro código.</p></div><button class="btn primary" onclick="createQr()">＋ Novo QR Code</button></div><div class="notice">Os primeiros 50 códigos serão criados automaticamente. Os novos códigos são ilimitados. Códigos sem destino configurado ficam inativos.</div><section class="panel" style="margin-top:16px"><div class="toolbar" style="justify-content:space-between"><strong id="qrCount">Carregando…</strong><button class="btn" onclick="loadQrs()">Atualizar</button></div><div id="qrList" style="margin-top:14px"></div></section>`;}
let qrRows=[];
async function loadQrs(){const root=document.getElementById('qrList');if(!root||!supabaseClient||!currentUser)return;root.innerHTML='<p class="muted">Carregando códigos…</p>';try{let {data,error}=await supabaseClient.from('central_qr_codes').select('*').order('code');if(error)throw error;qrRows=data||[];if(!qrRows.length){const rows=Array.from({length:50},(_,i)=>({owner_id:currentUser.id,code:'QR-'+String(i+1).padStart(3,'0'),name:'QR '+String(i+1).padStart(3,'0'),destination_url:'https://example.com',active:false}));const ins=await supabaseClient.from('central_qr_codes').insert(rows);if(ins.error)throw ins.error;({data,error}=await supabaseClient.from('central_qr_codes').select('*').order('code'));if(error)throw error;qrRows=data||[];}renderQrList();}catch(e){root.innerHTML='<p class="muted">Erro ao carregar QR Codes: '+esc(e.message)+'</p>';}}
function renderQrList(){const root=document.getElementById('qrList');if(!root)return;document.getElementById('qrCount').textContent=qrRows.length+' códigos cadastrados';root.innerHTML=qrRows.map(q=>`<div class="panel" style="margin:10px 0;display:flex;gap:16px;align-items:center;flex-wrap:wrap"><div style="width:112px;height:112px;background:#fff;padding:7px;border-radius:8px;display:grid;place-items:center" id="qrimg-${q.id}"></div><div style="flex:1;min-width:230px"><strong>${esc(q.code)} — ${esc(q.name)}</strong><p class="muted" style="word-break:break-all;margin:7px 0">${q.destination_url==='https://example.com'?'Sem destino configurado':esc(q.destination_url)}</p><span class="pill ${q.active?'green':'red'}">${q.active?'Ativo':'Inativo'}</span><div class="toolbar" style="margin-top:10px"><button class="btn small" onclick="editQr('${q.id}')">Editar</button><button class="btn small" onclick="clearQr('${q.id}')">Limpar</button><button class="btn small" onclick="downloadQr('${q.id}')">↓ Baixar PNG</button></div></div></div>`).join('');qrRows.forEach(q=>{const el=document.getElementById('qrimg-'+q.id);if(el&&window.QRCode)new QRCode(el,{text:location.origin+'/api/qr/'+encodeURIComponent(q.code),width:98,height:98});});}
async function createQr(){const next=Math.max(0,...qrRows.map(q=>Number((q.code.match(/(\d+)$/)||[])[1]||0)))+1;const code='QR-'+String(next).padStart(3,'0');const name=prompt('Nome para o novo QR Code:',code);if(name===null)return;const dest=prompt('URL de destino (http:// ou https://):','https://');if(dest===null)return;if(!/^https?:\/\//i.test(dest.trim())){alert('Informe uma URL válida iniciada por http:// ou https://');return;}const {data,error}=await supabaseClient.from('central_qr_codes').insert({owner_id:currentUser.id,code,name:name.trim()||code,destination_url:dest.trim(),active:true}).select().single();if(error){alert('Erro ao criar: '+error.message);return;}qrRows.push(data);renderQrList();}
async function editQr(id){const q=qrRows.find(x=>x.id===id);if(!q)return;const name=prompt('Nome do QR Code:',q.name);if(name===null)return;const dest=prompt('URL de destino:',q.destination_url==='https://example.com'?'':q.destination_url);if(dest===null)return;if(!/^https?:\/\//i.test(dest.trim())){alert('Informe uma URL válida iniciada por http:// ou https://');return;}const active=confirm('Deixar este QR Code ATIVO?\nOK = ativo | Cancelar = inativo');const {data,error}=await supabaseClient.from('central_qr_codes').update({name:name.trim()||q.code,destination_url:dest.trim(),active,updated_at:new Date().toISOString()}).eq('id',id).select().single();if(error){alert('Erro ao salvar: '+error.message);return;}qrRows=qrRows.map(x=>x.id===id?data:x);renderQrList();}
async function clearQr(id){const q=qrRows.find(x=>x.id===id);if(!q)return;if(!confirm('Limpar '+q.code+'? O nome e o link serão redefinidos, e o QR ficará inativo. O código QR permanece reservado para esta placa.'))return;const {data,error}=await supabaseClient.from('central_qr_codes').update({name:q.code,destination_url:'https://example.com',active:false,updated_at:new Date().toISOString()}).eq('id',id).select().single();if(error){alert('Erro ao limpar: '+error.message);return;}qrRows=qrRows.map(x=>x.id===id?data:x);renderQrList();}
function downloadQr(id){const q=qrRows.find(x=>x.id===id),el=document.getElementById('qrimg-'+id);if(!q||!el)return;const canvas=el.querySelector('canvas'),img=el.querySelector('img'),url=canvas?canvas.toDataURL('image/png'):img?.src;if(!url){alert('QR ainda está sendo gerado. Tente novamente.');return;}const a=document.createElement('a');a.href=url;a.download=q.code+'.png';a.click();}

function dashboard(){
 const op=operationFilter(),sales=operationSales(),lotsView=op?[op]:db.lots;
 const validSales=sales.filter(x=>x.status!=='Cancelada');
 const revenue=sum(validSales,s=>s.total),cost=sum(validSales,saleCost),profit=revenue-cost;
 const visits=op?db.visits.filter(v=>!v.lotId||String(v.lotId)===String(op.id)).length:db.visits.length;
 const converted=op?db.visits.filter(v=>(!v.lotId||String(v.lotId)===String(op.id))&&v.status==='Comprou').length:db.visits.filter(v=>v.status==='Comprou').length;
 const conv=visits?Math.round(converted/visits*100):0;
 const stock=op?available(op):allQty();
 const pending=sales.filter(s=>s.status==='Pendente'||s.status==='Parcialmente pago').length;
 const months=[];
 for(let i=5;i>=0;i--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');months.push({key,label:d.toLocaleDateString('pt-BR',{month:'short'}).replace('.',''),value:sum(validSales.filter(s=>(s.date||'').slice(0,7)===key),s=>s.total)});}
 const maxMonth=Math.max(1,...months.map(m=>m.value));
 const chart=months.map(m=>`<div class="dash-month"><strong>${money(m.value)}</strong><i style="height:${Math.max(3,m.value/maxMonth*112)}px"></i><span>${esc(m.label)}</span></div>`).join('');
 const recent=[...sales].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,5);
 const activity=recent.map(s=>`<div class="dash-activity-item"><i class="dash-activity-dot"></i><div><strong>${esc(s.clientName||getClient(s.clientId)?.name||'Venda registrada')}</strong><small>${esc(getProduct(s.productId)?.name||s.productName||'Produto')} · ${esc(s.date||'Sem data')} · ${money(s.total)}</small></div></div>`).join('')||'<div class="dash-empty">Suas movimentações aparecerão aqui quando registrar a primeira venda.</div>';
 const lots=lotsView.slice(-5).reverse().map(l=>`<div class="dash-stock-row"><span>${esc(l.name)}</span><div class="bar"><i style="width:${l.qty?Math.min(100,available(l)/l.qty*100):0}%"></i></div><strong>${available(l)} / ${l.qty}</strong></div>`).join('')||'<div class="dash-empty">Cadastre seu primeiro lote para acompanhar o estoque.</div>';
 const topCity={};validSales.forEach(s=>{let c=s.city||getClient(s.clientId)?.city||'Não informado';topCity[c]=(topCity[c]||0)+1});
 const bestCity=Object.entries(topCity).sort((a,b)=>b[1]-a[1])[0]?.[0]||'—';
 return `<section class="dash-intro"><div><div class="dash-kicker">SILVER NORTE · CENTRAL</div><h1>Visão geral da operação</h1><p>Acompanhe o desempenho, as vendas e o controle do seu negócio em um só lugar.</p></div><div class="toolbar">${operationSelector()}<button class="btn primary" onclick="openModal('sale')">＋ Registrar venda</button></div></section>
 <section class="dash-stats">
 <div class="dash-stat"><div class="dash-stat-top"><span>Receita registrada</span><i class="dash-stat-icon">↗</i></div><div class="dash-stat-value">${money(revenue)}</div><div class="dash-stat-foot">Vendas não canceladas</div></div>
 <div class="dash-stat"><div class="dash-stat-top"><span>Lucro bruto estimado</span><i class="dash-stat-icon">◈</i></div><div class="dash-stat-value">${money(profit)}</div><div class="dash-stat-foot">Receita menos custo dos itens</div></div>
 <div class="dash-stat"><div class="dash-stat-top"><span>Visitas comerciais</span><i class="dash-stat-icon">◎</i></div><div class="dash-stat-value">${visits}</div><div class="dash-stat-foot">${conv}% de conversão registrada</div></div>
 <div class="dash-stat"><div class="dash-stat-top"><span>Unidades em estoque</span><i class="dash-stat-icon">▦</i></div><div class="dash-stat-value">${stock}</div><div class="dash-stat-foot">${pending} venda(s) pendente(s) de pagamento</div></div>
 </section>
 <section class="dash-grid"><div class="panel"><div class="dash-panel-head"><h3>Desempenho de vendas</h3><small>Últimos 6 meses · ${op?'operação selecionada':'todas as operações'}</small></div><div class="dash-chart">${chart}</div></div>
 <div class="panel"><div class="dash-panel-head"><h3>Atividade recente</h3><small>Últimas vendas</small></div><div class="dash-activity">${activity}</div></div></section>
 <section class="dash-bottom"><div class="panel"><div class="dash-panel-head"><h3>Estoque por lote</h3><small>Disponibilidade atual</small></div><div class="dash-stock">${lots}</div></div>
 <div class="panel"><div class="dash-panel-head"><h3>Acesso rápido</h3><small>Rotina operacional</small></div><div class="quickgrid"><button class="quick" onclick="openModal('visit')">＋ Nova visita<span>Registrar prospecção</span></button><button class="quick" onclick="openModal('sale')">↗ Nova venda<span>Registrar faturamento</span></button><button class="quick" onclick="openModal('lot')">▦ Novo lote<span>Entrada de estoque</span></button><button class="quick" onclick="openModal('client')">♙ Novo cliente<span>Salvar contato</span></button></div><p class="muted" style="font-size:10px;margin:15px 0 0">Cidade com mais vendas: <b>${esc(bestCity)}</b></p></div></section>`;
}
function visitsPage(){const count=s=>db.visits.filter(v=>v.status===s).length;let rows=db.visits.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(v=>`<tr><td>${esc(v.date)}</td><td>${esc(v.name)}</td><td>${esc(v.city||'—')}</td><td>${esc(v.niche||'—')}</td><td>${statusPill(v.status)}</td><td>${esc(v.next||'—')}</td><td>${rowActions('visit',v)}</td></tr>`);const statuses=['Não visitado','Visitado','Responsável ausente','Contato conseguido','Demonstração realizada','Proposta apresentada','Retorno agendado','Venda realizada','Sem interesse'];return `<div class="pagehead"><div><h1>Comercial e visitas</h1><p>Acompanhe cada oportunidade, do primeiro contato até a venda.</p></div><button class="btn primary" onclick="openModal('visit')">＋ Nova prospecção</button></div><div class="cards">${metric('Estabelecimentos',db.visits.length)}${metric('Demonstrações',count('Demonstração realizada'))}${metric('Propostas',count('Proposta apresentada'))}${metric('Vendas',count('Venda realizada'))}</div><div class="toolbar"><input class="field search" placeholder="Buscar estabelecimento, cidade ou nicho..." oninput="filterTable(this)"><select class="field" onchange="filterStatus(this)"><option value="">Todos os status</option>${statuses.map(x=>`<option>${x}</option>`).join('')}</select></div><div id="filterable">${table(['Data','Estabelecimento','Cidade','Nicho','Etapa comercial','Próximo contato','Ações'],rows)}</div>`}
function clientsPage(){let rows=db.clients.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.city||'—')}</td><td>${esc(c.niche||'—')}</td><td>${esc(c.phone||'—')}</td><td>${db.sales.filter(s=>String(s.clientId)===String(c.id)&&s.status!=='Cancelada').length}</td><td>${rowActions('client',c)}</td></tr>`);return `<div class="pagehead"><div><h1>Clientes e contatos</h1><p>Cadastro centralizado com histórico de compras.</p></div><button class="btn primary" onclick="openModal('client')">＋ Novo cliente</button></div><div class="toolbar"><input class="field search" placeholder="Buscar cliente..." oninput="filterTable(this)"></div>${table(['Nome','Cidade','Nicho','Telefone','Vendas','Ações'],rows)}`}
function salesPage(){let rows=db.sales.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(s=>`<tr><td>${esc(s.date)}</td><td>${esc(s.clientName||getClient(s.clientId)?.name||'—')}</td><td>${esc(s.city||'—')}</td><td>${esc(getProduct(s.productId)?.name||s.productName||'—')}</td><td>${esc(s.variant||'—')}</td><td>${s.qty}</td><td>${money(s.total)}</td><td>${money(saleCost(s))}</td><td style="color:var(--green)">${money(saleProfit(s))}</td><td>${statusPill(s.status||'Pago')}</td><td>${rowActions('sale',s)}</td></tr>`);return `<div class="pagehead"><div><h1>Vendas</h1><p>Receita, custo e lucro por venda.</p></div><button class="btn primary" onclick="openModal('sale')">＋ Registrar venda</button></div><div class="cards">${metric('Vendas',db.sales.filter(s=>s.status!=='Cancelada').length)}${metric('Receita',money(sum(db.sales.filter(s=>s.status!=='Cancelada'),s=>s.total)))}${metric('Custos',money(sum(db.sales.filter(s=>s.status!=='Cancelada'),saleCost)))}${metric('Lucro bruto',money(sum(db.sales.filter(s=>s.status!=='Cancelada'),saleProfit)))}</div>${table(['Data','Cliente','Cidade','Produto','Variação','Qtd.','Venda','Custo','Lucro','Status','Ações'],rows)}`}

function fieldHTML(f,val){let [key,label,type,def]=f;val=val??(Array.isArray(def)?'':def);let input='';if(type==='textarea')input=`<textarea class="field" name="${key}">${esc(val)}</textarea>`;else if(type==='select')input=`<select class="field" name="${key}">${def.map(x=>`<option ${String(val)===x?'selected':''}>${esc(x)}</option>`).join('')}</select>`;else if(type==='product'||type==='client'||type==='lot'){let arr=type==='product'?db.products:type==='client'?db.clients:db.lots;let opts=arr.map(x=>`<option value="${x.id}" ${String(val)===String(x.id)?'selected':''}>${esc(x.name||x.title)}${type==='lot'?' · disponível '+available(x):''}</option>`).join('');input=`<select class="field" name="${key}"><option value="">${type==='lot'?'Sem lote vinculado':'Selecione...'}</option>${opts}</select>`}else if(type==='category')input=`<select class="field" name="${key}">${db.customCats.map(x=>`<option ${String(val)===x?'selected':''}>${esc(x)}</option>`).join('')}</select>`;else {const isMoney=moneyKeys.has(key);const inputType=isMoney?'text':type;const inputVal=isMoney?moneyInputValue(val):val;input=`<input class="field" name="${key}" type="${inputType}" ${isMoney?'inputmode="decimal" placeholder="0,00" autocomplete="off"':''} value="${esc(inputVal)}" ${key==='upload'?'':''}>`;}return `<div class="formfield ${type==='textarea'?'full':''}"><label>${label}</label>${input}</div>`}
function openModal(kind,record=null){modalKind=kind;editing=record;const s=schemas[kind];$('#modalTitle').textContent=record?'Editar registro':s.title;let fields=s.fields;if(record&&kind==='file')fields=fields.filter(f=>f[0]!=='upload');const formRecord=record&&kind==='lot'?{...record,unitProductionCost:record.unitProductionCost??(Number(record.qty)?Number(record.productCost||0)/Number(record.qty):0)}:record;$('#formFields').innerHTML=fields.map(f=>fieldHTML(f,formRecord?formRecord[f[0]]:undefined)).join('');$('#modalback').classList.add('show');if(kind==='lot'&&!record){let inp=$('[name=name]');if(inp&&!inp.value)inp.value='Lote '+(db.lots.length+1)}if((kind==='sale'||kind==='expense')&&!record&&selectedOperationId!=='all'){const lotField=$('[name=lotId]');if(lotField)lotField.value=selectedOperationId}if(kind==='sale'&&!record){const p=$('[name=productId]');if(p&&db.products.length===1){p.value=db.products[0].id;const prod=getProduct(p.value);$('[name=unitPrice]').value=prod?.price||''}}}

if(kind==='sale'){obj.qty=Math.max(1,Number(obj.qty||1));obj.unitPrice=parseMoney(obj.unitPrice);obj.discount=parseMoney(obj.discount);obj.total=Math.max(0,Math.round((obj.qty*obj.unitPrice-obj.discount)*100)/100);obj.cost=obj.cost===''?'':parseMoney(obj.cost);obj.id=editing?.id||id();if(!obj.clientName&&obj.clientId)obj.clientName=getClient(obj.clientId)?.name||'';if(!obj.city&&obj.clientId)obj.city=getClient(obj.clientId)?.city||'';if(!obj.productId&&db.products.length===1)obj.productId=db.products[0].id;if(obj.lotId){const l=getLot(obj.lotId);if(l&&obj.qty>available(l)&&obj.status!=='Cancelada'){alert(`Estoque insuficiente neste lote. Disponível: ${available(l)}.`);return}}}

async function exportBackup(){let qrs=[];if(currentUser&&supabaseClient){const {data,error}=await supabaseClient.from('central_qr_codes').select('code,name,destination_url,active').order('code');if(error){alert('Não foi possível incluir os QR Codes no backup: '+error.message);return}qrs=data||[]}const blob=new Blob([JSON.stringify({...db,qrs,exportedAt:new Date().toISOString(),app:'CENTRAL'},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='central-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}
function importBackup(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{try{const parsed=JSON.parse(r.result);if(!confirm('Importar este backup vai substituir os dados atuais e sincronizar com sua conta na nuvem. Exporte o estado atual antes, se precisar. Continuar?'))return;for(const k of Object.keys(seed))db[k]=Array.isArray(parsed[k])?parsed[k]:[];save();render();if(currentUser){const {error}=await supabaseClient.from('central_data').upsert({user_id:currentUser.id,data:db,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error)throw error;if(Array.isArray(parsed.qrs)){const qrPayload=parsed.qrs.map(q=>({owner_id:currentUser.id,code:q.code,name:q.name,destination_url:q.destination_url,active:!!q.active}));if(qrPayload.length){const qrResult=await supabaseClient.from('central_qr_codes').upsert(qrPayload,{onConflict:'code'});if(qrResult.error)throw qrResult.error;}}setCloudStatus('Backup importado e sincronizado');alert('Backup importado e salvo na nuvem!')}else alert('Backup importado localmente. Entre para sincronizar.')}catch(e){console.error(e);alert('Não foi possível importar/sincronizar: '+(e.message||'arquivo inválido'))}inp.value=''};r.readAsText(f)}
function exportCSV(which){const arr=db[which]||[];if(!arr.length){alert('Não há dados para exportar.');return}const cols=[...new Set(arr.flatMap(o=>Object.keys(o).filter(k=>k!=='data')))];const csv=[cols.join(';'),...arr.map(o=>cols.map(k=>'"'+String(o[k]??'').replace(/"/g,'""')+'"').join(';'))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download=which+'-'+today()+'.csv';a.click();URL.revokeObjectURL(a.href)}
function downloadFile(fid){const f=db.files.find(x=>x.id===fid);if(!f?.data){alert('Arquivo não está disponível.');return}const a=document.createElement('a');a.href=f.data;a.download=f.name;a.click()}
function addCategory(){const i=$('#newCat'),v=i.value.trim();if(v&&!db.customCats.includes(v)){db.customCats.push(v);save();render()}i.value=''}
function removeCategory(c){if(!confirm('Remover esta categoria das opções? Notas existentes serão preservadas.'))return;db.customCats=db.customCats.filter(x=>x!==c);save();render()}
function resetData(){if(prompt('Digite APAGAR para excluir todos os dados deste navegador:')!=='APAGAR')return;db=JSON.parse(JSON.stringify(seed));save();render()}

async function enterCentral(session){const user=session.user;if((user.email||'').toLowerCase()!=='dihlopes023@gmail.com'){await supabaseClient.auth.signOut();throw new Error('Este e-mail não tem autorização para acessar o CENTRAL.')}currentUser=user;document.getElementById('authGate').style.display='none';document.getElementById('centralApp').style.display='grid';setCloudStatus('Carregando dados…');try{const {data,error}=await supabaseClient.from('central_data').select('data').eq('user_id',user.id).maybeSingle();if(error)throw error;if(data&&data.data){for(const k of Object.keys(seed))db[k]=Array.isArray(data.data[k])?data.data[k]:[];normalizeVisitStatuses();localStorage.setItem('central_db_v1',JSON.stringify(db));setCloudStatus('Dados da nuvem carregados')}else{setCloudStatus('Importe seu backup para começar',false)}render()}catch(e){setCloudStatus('Erro ao carregar nuvem: '+e.message,false);render()}}
function showRecoveryScreen(){document.getElementById('loginForm').style.display='none';document.getElementById('recoveryForm').style.display='block';document.getElementById('centralApp').style.display='none';document.getElementById('authGate').style.display='flex'}
document.getElementById('forgotPasswordBtn').addEventListener('click',async()=>{const msg=document.getElementById('authMessage');msg.style.color='#aab8ff';msg.textContent='Enviando link de recuperação…';try{const email=document.getElementById('authEmail').value.trim();if(!email)throw new Error('Informe seu e-mail.');const {error}=await supabaseClient.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin});if(error)throw error;msg.textContent='Se o e-mail estiver cadastrado, enviaremos um link para criar uma nova senha.'}catch(err){msg.style.color='#ff9aa3';msg.textContent=err.message||'Não foi possível enviar o e-mail.'}});
document.getElementById('recoveryForm').addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('recoveryMessage'),btn=document.getElementById('saveNewPassword');msg.style.color='#ff9aa3';const password=document.getElementById('newPassword').value,confirm=document.getElementById('confirmPassword').value;if(password.length<8){msg.textContent='A senha precisa ter pelo menos 8 caracteres.';return}if(password!==confirm){msg.textContent='As senhas não coincidem.';return}btn.disabled=true;btn.textContent='Salvando…';try{const {error}=await supabaseClient.auth.updateUser({password});if(error)throw error;msg.style.color='#58d6a0';msg.textContent='Senha alterada. Faça login com sua nova senha.';await supabaseClient.auth.signOut();setTimeout(()=>{document.getElementById('recoveryForm').style.display='none';document.getElementById('loginForm').style.display='block';document.getElementById('authMessage').style.color='#58d6a0';document.getElementById('authMessage').textContent='Senha alterada com sucesso. Entre novamente.'},900)}catch(err){msg.textContent=err.message||'Não foi possível alterar a senha.'}finally{btn.disabled=false;btn.textContent='Salvar nova senha'}});
supabaseClient.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY'){window.__centralRecoveryFlow=true;showRecoveryScreen()}});
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('authMessage'),btn=document.getElementById('loginButton');msg.textContent='';btn.disabled=true;btn.textContent='Entrando…';try{const email=document.getElementById('authEmail').value.trim();const password=document.getElementById('authPassword').value;const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});if(error)throw error;await enterCentral(data.session)}catch(err){msg.textContent=err.message||'Não foi possível entrar.'}finally{btn.disabled=false;btn.textContent='Entrar no CENTRAL'}});
document.getElementById('logoutBtn').addEventListener('click',async()=>{await supabaseClient.auth.signOut();currentUser=null;document.getElementById('centralApp').style.display='none';document.getElementById('authGate').style.display='flex'});
(async()=>{try{const recovery=window.location.hash.includes('type=recovery')||new URLSearchParams(window.location.search).has('code');if(recovery){window.__centralRecoveryFlow=true;showRecoveryScreen();return}const {data,error}=await supabaseClient.auth.getSession();if(error)throw error;if(data.session)await enterCentral(data.session)}catch(e){document.getElementById('authMessage').textContent='Erro de autenticação: '+e.message}})();
